<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazzo - Registro</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body style="background-color: var(--color-superficie)">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Crear Negocio</h2>
        <form id="registro-form">
          <div class="form-group">
            <label for="negocio">Identificador del Negocio *</label>
            <input
              type="text"
              id="negocio"
              class="form-control"
              placeholder="minúsculas y números"
              required
            />
            <div id="error-negocio" class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="usuario">Usuario Admin *</label>
            <input type="text" id="usuario" class="form-control" required />
            <div id="error-usuario" class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico *</label>
            <input type="email" id="email" class="form-control" required />
            <div id="error-email" class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="password">Contraseña *</label>
            <input
              type="password"
              id="password"
              class="form-control"
              required
            />
            <div id="error-password" class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="nombre">Nombre o Razón Social (Opcional)</label>
            <input type="text" id="nombre" class="form-control" />
          </div>
          <div class="form-group">
            <label for="rubro">Rubro (Opcional)</label>
            <select id="rubro" class="form-control">
              <option value="">Seleccione...</option>
              <option value="gastronomia">Gastronomía</option>
              <option value="indumentaria">Indumentaria</option>
              <option value="tecnologia">Tecnología</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="form-group" id="grupo-otro-rubro" style="display: none">
            <label for="otro-rubro">Especifique su rubro</label>
            <input type="text" id="otro-rubro" class="form-control" />
          </div>
          <button type="submit" class="btn btn-primario btn-block">
            Registrarse
          </button>
        </form>
        <div class="auth-links">
          <a href="login.html">Ya tengo cuenta - Iniciar Sesión</a>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // Lógica para mostrar/ocultar campo "Otro" en rubro
      document.getElementById("rubro").addEventListener("change", (e) => {
        const grupoOtro = document.getElementById("grupo-otro-rubro");
        if (e.target.value === "otro") {
          grupoOtro.style.display = "block";
        } else {
          grupoOtro.style.display = "none";
        }
      });

      document
        .getElementById("registro-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          limpiarErrores();

          const negocio = document.getElementById("negocio").value.trim();
          const usuario = document.getElementById("usuario").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const nombre = document.getElementById("nombre").value.trim();
          let rubro = document.getElementById("rubro").value;

          if (rubro === "otro")
            rubro = document.getElementById("otro-rubro").value.trim();

          // Validaciones del cliente
          const reIdentificador = /^[a-z0-9]{4,20}$/;
          if (!reIdentificador.test(negocio)) {
            mostrarError(
              "negocio",
              "Solo minúsculas y números, de 4 a 20 caracteres.",
            );
            return;
          }
          if (!reIdentificador.test(usuario)) {
            mostrarError(
              "usuario",
              "Solo minúsculas y números, de 4 a 20 caracteres.",
            );
            return;
          }
          if (!validarEmail(email)) {
            mostrarError("email", "Ingresá un correo válido.");
            return;
          }
          if (!validarPassword(password)) {
            mostrarError(
              "password",
              "De 8 a 64 caracteres, con mayúscula, minúscula, número y símbolo.",
            );
            return;
          }

          try {
            const data = await fetchAPI("/auth/registro", "POST", {
              negocio,
              usuario,
              email,
              password,
              nombre,
              rubro,
            });

            // Auto-login exitoso: guardar tokens y al dashboard
            guardarSesion(data.access_token, data.refresh_token);
          } catch (error) {
            // El backend devuelve error específico por campo
            const msg = error.message.toLowerCase();
            if (msg.includes("negocio")) mostrarError("negocio", error.message);
            else if (msg.includes("usuario"))
              mostrarError("usuario", error.message);
            else if (msg.includes("email") || msg.includes("correo"))
              mostrarError("email", error.message);
            else alert(error.message);
          }
        });
    </script>
  </body>
</html>
