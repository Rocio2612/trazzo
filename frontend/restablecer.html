<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazzo - Restablecer Contraseña</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body style="background-color: var(--color-superficie)">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Nueva Contraseña</h2>
        <form id="restablecer-form">
          <div class="form-group">
            <label for="password">Nueva Contraseña</label>
            <input
              type="password"
              id="password"
              class="form-control"
              required
            />
            <div id="error-password" class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="password-confirm">Confirmar Contraseña</label>
            <input
              type="password"
              id="password-confirm"
              class="form-control"
              required
            />
            <div id="error-password-confirm" class="error-message"></div>
          </div>
          <button type="submit" class="btn btn-primario btn-block">
            Guardar Nueva Contraseña
          </button>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // 1. Leer el token de la URL
      const urlParams = new URLSearchParams(window.location.search);
      const tokenRecuperacion = urlParams.get("token");

      if (!tokenRecuperacion) {
        alert("Enlace inválido o expirado.");
        window.location.href = "login.html";
      }

      document
        .getElementById("restablecer-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          limpiarErrores();

          const password = document.getElementById("password").value;
          const passwordConfirm =
            document.getElementById("password-confirm").value;

          if (!validarPassword(password)) {
            mostrarError(
              "password",
              "De 8 a 64 caracteres, con mayúscula, minúscula, número y símbolo.",
            );
            return;
          }
          if (password !== passwordConfirm) {
            mostrarError("password-confirm", "Las contraseñas no coinciden.");
            return;
          }

          try {
            await fetchAPI("/auth/restablecer", "POST", {
              token_recuperacion: tokenRecuperacion,
              nueva_password: password,
            });
            alert(
              "Contraseña actualizada correctamente. Ya podés iniciar sesión.",
            );
            window.location.href = "login.html";
          } catch (error) {
            alert(
              "El enlace es inválido o ya fue utilizado. Solicitá uno nuevo.",
            );
          }
        });
    </script>
  </body>
</html>
