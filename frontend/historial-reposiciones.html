<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazzo - Historial de reposiciones</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/productos.css" />
  </head>
  <body>
    <main class="productos-pagina" data-modulo="productos">
      <div class="productos-cabecera">
        <h1>Historial de reposiciones</h1>
        <div class="cabecera-acciones">
          <a href="productos.html" class="btn-pz btn-pz-sec"
            >← Volver a Productos</a
          >
        </div>
      </div>

      <div class="productos-barra">
        <input
          type="text"
          id="buscador"
          placeholder="Buscar por producto o proveedor..."
          autocomplete="off"
          data-testid="buscador"
        />
        <select id="filtro-proveedor" data-testid="filtro-proveedor">
          <option value="">Todos los proveedores</option>
        </select>
        <select id="filtro-fecha" data-testid="filtro-fecha">
          <option value="todas">Todas las fechas</option>
          <option value="hoy">Hoy</option>
          <option value="mes">Este mes</option>
          <option value="año">Este año</option>
        </select>
      </div>

      <div class="productos-tarjeta">
        <div class="tabla-scroll">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Monto total</th>
                <th>Costo unitario real</th>
                <th>Fecha</th>
                <th>Proveedor</th>
                <th>Registrado por</th>
                <th>Estado</th>
                <th class="acciones-admin hidden">Acciones</th>
              </tr>
            </thead>
            <tbody id="historial-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/roles.js"></script>
    <script type="module" src="js/layout.js"></script>
    <script type="module" src="js/historial-reposiciones.js"></script>
    <script type="module">
      import { iniciarNotificaciones } from "./js/notificaciones.js";
      iniciarNotificaciones();
    </script>
  </body>
</html>
