<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazzo - Productos</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <style>
      .badge {
        padding: 0.2rem 0.5rem;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: bold;
      }
      .badge-rojo {
        background: #fdecee;
        color: #b02a37;
      }
      .badge-ambar {
        background: #fff7e0;
        color: #7a5200;
      }
      .banner-ambar {
        background: #fff7e0;
        border: 1px solid #f3d68a;
        color: #7a5200;
        padding: 0.5rem;
        border-radius: 6px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .hidden {
        display: none !important;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        width: 100%;
        max-width: 500px;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.25rem;
      }
      .form-control {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      .error-message {
        color: red;
        font-size: 0.8rem;
        margin-top: 0.25rem;
      }
      .acciones {
        display: flex;
        gap: 0.5rem;
      }
      .btn-icon {
        background: none;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        cursor: pointer;
        padding: 0.2rem 0.5rem;
      }
      .texto-vacio {
        text-align: center;
        color: gray;
        padding: 2rem;
      }
    </style>
  </head>
  <body>

    <main class="contenido" style="padding: 2rem">
      <!-- Panel de Alertas Oculto por defecto -->
      <div
        id="panel-alertas"
        class="hidden"
        style="
          position: absolute;
          right: 2rem;
          top: 60px;
          background: white;
          border: 1px solid #ccc;
          padding: 1rem;
          width: 300px;
          z-index: 100;
        "
      >
        <!-- Se llena con JS -->
      </div>

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1rem;
        "
      >
        <h1>Productos</h1>
        <button
          class="btn btn-primario"
          onclick="
            document.getElementById('modal-producto').classList.remove('hidden')
          "
        >
          + Nuevo producto
        </button>
      </div>

      <div style="display: flex; gap: 1rem; margin-bottom: 1rem">
        <input
          type="text"
          placeholder="Buscar por nombre..."
          class="form-control"
          style="max-width: 300px"
        />
        <button class="btn btn-outline">Stock bajo</button>
        <button class="btn btn-outline">Ver ocultos</button>
      </div>

      <table style="width: 100%; border-collapse: collapse; text-align: left">
        <thead>
          <tr style="border-bottom: 2px solid #eee">
            <th>NOMBRE</th>
            <th>CATEGORÍA</th>
            <th>COSTO</th>
            <th>PRECIO</th>
            <th>STOCK</th>
            <th>MÍNIMO</th>
            <th>PROVEEDOR</th>
            <th>CREADO POR</th>
            <th>ACCIONES</th>
          </tr>
        </thead>
        <tbody id="productos-tbody">
          <!-- Se llena con JS -->
        </tbody>
      </table>
    </main>

    <!-- MODAL: NUEVO/EDITAR PRODUCTO -->
    <div id="modal-producto" class="modal-backdrop hidden">
      <div class="modal-content">
        <h2>Nuevo / Editar Producto</h2>
        <form id="form-producto">
          <input type="hidden" id="prod-id" />

          <div id="banner-precio-menor" class="banner-ambar hidden">
            El precio de venta es menor al costo unitario.
          </div>

          <div class="form-group">
            <label>Nombre *</label>
            <input type="text" id="nombre" class="form-control" required />
            <div id="error-nombre" class="error-message hidden"></div>
          </div>
          <div class="form-group">
            <label>Costo unitario *</label>
            <input
              type="number"
              id="costo_unitario"
              class="form-control"
              required
              min="0.01"
              step="0.01"
            />
            <div id="error-costo_unitario" class="error-message hidden"></div>
          </div>
          <div class="form-group">
            <label>Precio de venta *</label>
            <input
              type="number"
              id="precio_venta"
              class="form-control"
              required
              min="0.01"
              step="0.01"
            />
            <div id="error-precio_venta" class="error-message hidden"></div>
          </div>
          <div class="form-group">
            <label>Stock actual *</label>
            <input
              type="number"
              id="stock_actual"
              class="form-control"
              required
              min="0"
            />
          </div>
          <div class="form-group">
            <label>Stock mínimo de alerta *</label>
            <input
              type="number"
              id="stock_minimo"
              class="form-control"
              required
              min="0"
            />
          </div>
          <div class="form-group">
            <label>Categoría (opcional)</label>
            <select id="categoria" class="form-control">
              <option value="">Sin categorías</option>
            </select>
          </div>
          <div class="form-group">
            <label>Proveedor (opcional)</label>
            <input
              type="text"
              id="proveedor"
              class="form-control"
              placeholder="Nombre o razón social"
            />
          </div>

          <div style="text-align: right; margin-top: 1rem">
            <button
              type="button"
              class="btn btn-outline"
              onclick="
                document
                  .getElementById('modal-producto')
                  .classList.add('hidden')
              "
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primario">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: REPOSICIÓN -->
    <div id="modal-reposicion" class="modal-backdrop hidden">
      <div class="modal-content">
        <h2>Reposición de Stock</h2>
        <p style="color: #7a5200; font-size: 0.9rem; margin-bottom: 1rem">
          Aviso: Esta acción actualizará el costo del producto.
        </p>
        <form id="form-reposicion">
          <input type="hidden" id="repo-prod-id" />
          <input type="hidden" id="repo-ultimo-costo" />

          <div class="form-group">
            <label>Cantidad *</label>
            <input
              type="number"
              id="repo-cantidad"
              class="form-control"
              required
              min="1"
            />
          </div>
          <div class="form-group">
            <label>Monto total *</label>
            <input
              type="number"
              id="repo-monto"
              class="form-control"
              required
              min="0.01"
              step="0.01"
            />
          </div>
          <div class="form-group">
            <label>Fecha de adquisición *</label>
            <input type="date" id="repo-fecha" class="form-control" required />
          </div>
          <div class="form-group">
            <label>Proveedor (opcional)</label>
            <input type="text" id="repo-proveedor" class="form-control" />
          </div>

          <div style="text-align: right; margin-top: 1rem">
            <button
              type="button"
              class="btn btn-outline"
              onclick="
                document
                  .getElementById('modal-reposicion')
                  .classList.add('hidden')
              "
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primario">Confirmar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/notificaciones.js"></script>
    <script type="module" src="js/productos.js"></script>
    <script src="js/roles.js"></script>
    <script type="module" src="js/layout.js"></script>
  </body>
</html>
