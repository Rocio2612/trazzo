<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazzo - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body style="background-color: var(--color-superficie)">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Recuperar Acceso</h2>
        <p style="text-align: center; font-size: 0.9rem; margin-bottom: 1rem">
          Ingresá tu correo y te enviaremos un enlace para restablecer tu
          contraseña.
        </p>
        <form id="recuperar-form">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" class="form-control" required />
            <div id="error-email" class="error-message"></div>
          </div>
          <button type="submit" class="btn btn-primario btn-block">
            Enviar Enlace
          </button>
        </form>
        <div class="auth-links">
          <a href="login.html">Volver al Login</a>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document
        .getElementById("recuperar-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          limpiarErrores();

          const email = document.getElementById("email").value.trim();

          if (!validarEmail(email)) {
            mostrarError("email", "Ingresá un correo válido.");
            return;
          }

          await conEnvioBloqueado(e.target, async () => {
            try {
              await fetchAPI("/auth/recuperar", "POST", { correo: email });
              // El backend responde 200 siempre, por seguridad.
              alert(
                "Si el correo existe, recibirás un mensaje con las instrucciones.",
              );
              window.location.href = "login.html";
              return true;
            } catch (error) {
              if (mostrarErrorDeApi(error)) return;
              alert("Ocurrió un error. Intentá de nuevo más tarde.");
            }
          });
        });
    </script>
  </body>
</html>
