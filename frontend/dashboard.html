<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trazzo - Panel Principal</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        .header-dashboard { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--color-borde); background-color: var(--color-fondo); }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .contenido { padding: 3rem 2rem; text-align: center; }
        .menu-modulos { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 2rem; }
        .menu-modulos span { padding: 0.5rem 1rem; border: 1px solid var(--color-borde); border-radius: 6px; }
    </style>
</head>
<body style="background-color: var(--color-superficie);">

    <header class="header-dashboard">
        <div class="logo">Trazzo</div>
        <button id="btn-logout" class="btn btn-outline">Cerrar Sesión</button>
    </header>

    <main class="contenido">
        <h1>Bienvenido/a al Sistema</h1>
        <p>Este es el panel principal de Trazzo.</p>

        <!-- Placeholder: los módulos se ocultan según el rol (ver js/roles.js) -->
        <nav class="menu-modulos">
            <span data-modulo="ventas">Ventas</span>
            <span data-modulo="productos">Productos</span>
            <span data-modulo="notificaciones">Notificaciones</span>
            <span data-modulo="clientes">Clientes</span>
            <span data-modulo="proveedores">Proveedores</span>
            <span data-modulo="insumos">Insumos</span>
            <span data-modulo="bienes_uso">Bienes de Uso</span>
            <span data-modulo="gastos">Gastos</span>
            <span data-modulo="cuentas_corrientes">Cuenta Corriente</span>
            <span data-modulo="personal">Personal</span>
            <span data-modulo="reportes">Reportes</span>
        </nav>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/roles.js"></script>
    <script>
        // 1. Protección de Ruta
        const token = localStorage.getItem('trazzo_access_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // 2. Cierre de Sesión
        document.getElementById('btn-logout').addEventListener('click', async () => {
            const confirmar = confirm("¿Estás seguro/a que querés cerrar sesión?");
            if (confirmar) {
                try { await fetchAPI('/auth/logout', 'POST'); } 
                catch (error) { console.log("Error al notificar al back."); } 
                finally {
                    localStorage.removeItem('trazzo_access_token');
                    localStorage.removeItem('trazzo_refresh_token');
                    window.location.href = 'login.html';
                }
            }
        });
    </script>
</body>
</html>
